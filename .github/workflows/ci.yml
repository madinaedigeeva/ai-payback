name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Specification is internally consistent
        run: ai-payback validate

      - name: Worked example runs end to end
        run: |
          ai-payback run examples/worked-example.yaml > /dev/null
          ai-payback run examples/worked-example.yaml --format json > /dev/null
          ai-payback run examples/worked-example.yaml \
            --preset yedigeyeva_2026_illustrative > /dev/null

      - name: Instrument and sources render
        run: |
          ai-payback questions > /dev/null
          ai-payback template > /dev/null
          ai-payback sources > /dev/null

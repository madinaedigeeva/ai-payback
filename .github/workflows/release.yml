name: Release

# Publishes to PyPI when a version tag is pushed.
#
# Authentication is by PyPI Trusted Publishing (OpenID Connect), not an API
# token. Nothing secret is stored in this repository or in GitHub Actions
# secrets: PyPI verifies the workflow's identity directly. This is both the
# safer option and the one that requires no credential to change hands.
#
# One-time setup on PyPI, under the project's Publishing settings:
#   Owner:          madinaedigeeva
#   Repository:     ai-payback
#   Workflow name:  release.yml
#   Environment:    pypi
#
# Then, to release:
#   git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Validate the specification
        run: ai-payback validate
      - name: Tag must match the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import ai_payback; print(ai_payback.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match package version $pkg"
            exit 1
          fi
          echo "tag and package version agree: $pkg"

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # Gated on a repository variable rather than attempted unconditionally.
    # Trusted Publishing needs a pending publisher registered on PyPI first, and
    # that registration requires a password re-confirmation that only the account
    # owner can give. Until it exists, this job would fail on every tag and turn a
    # perfectly good release red for a reason that has nothing to do with the code.
    # Skipping is the honest signal: the artifact built and verified; only the
    # upload is not wired up yet.
    #   gh variable set PYPI_TRUSTED_PUBLISHER_READY --body true
    if: vars.PYPI_TRUSTED_PUBLISHER_READY == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
